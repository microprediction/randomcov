name: paper

# The measure-audit paper makes reproducibility a central claim, so "it
# builds" should not be something only one laptop knows (modeled on
# winning's docs/latex_src paper.yml). pdflatex -> bibtex -> pdflatex x2
# to resolve natbib citations, then the checks that actually catch
# breakage: zero unresolved references in the rendered text, no
# undefined citations, no duplicate labels, and a page count sanity
# floor. A stale \label or a dropped \ref renders as "(?)" and is
# invisible in the LaTeX exit code.

on:
  push:
    branches: [main]
    paths:
      - "papers/measure_audit/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "papers/measure_audit/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-bibtex-extra \
            texlive-fonts-recommended texlive-science poppler-utils
      - name: pdflatex -> bibtex -> pdflatex x2
        working-directory: papers/measure_audit
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex \
            > pass1.log 2>&1 || { echo "pdflatex failed on pass 1"; tail -60 pass1.log; exit 1; }
          bibtex main > bibtex.log 2>&1 || { echo "bibtex failed"; cat bibtex.log; exit 1; }
          for pass in 2 3; do
            pdflatex -interaction=nonstopmode -halt-on-error main.tex \
              > "pass$pass.log" 2>&1 || {
                echo "pdflatex failed on pass $pass"; tail -60 "pass$pass.log"
                exit 1; }
          done
      - name: No unresolved references
        working-directory: papers/measure_audit
        run: |
          n=$(pdftotext main.pdf - | grep -c "(?)" || true)
          pages=$(pdfinfo main.pdf | awk '/^Pages/ {print $2}')
          echo "pages: $pages, unresolved references: $n"
          if [ "$n" -ne 0 ]; then
            echo "unresolved references in the rendered PDF:"
            pdftotext main.pdf - | grep -n "(?)" | head -20
            exit 1
          fi
          if [ "$pages" -lt 10 ]; then
            echo "only $pages pages: the build is truncated"; exit 1
          fi
      - name: Undefined citations or duplicate labels
        working-directory: papers/measure_audit
        run: |
          if grep -qE "LaTeX Warning: (Citation|There were undefined)" main.log; then
            grep -E "LaTeX Warning: (Citation|There were undefined)" main.log
            exit 1
          fi
          if grep -q "multiply defined" main.log; then
            grep -n "multiply defined" main.log; exit 1
          fi
          echo "no undefined citations, no duplicate labels"
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: papers/measure_audit/main.pdf
